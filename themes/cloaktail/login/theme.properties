parent=keycloak.v2
import=common/keycloak

# keycloak.v2's stylesheet keeps its tooltip and helper styles; cloaktail.css restyles everything else.
styles=css/styles.css css/cloaktail.css
scripts=js/signup.js

# Always dark: PatternFly's dark variant plus the CloakTail navy palette, whatever the OS setting.
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark ct-theme

# Where the sandbox guide links to: the CLOAKTAIL_URL environment variable, or localhost.
cloaktailUrl=${env.CLOAKTAIL_URL:http://localhost:3000}
