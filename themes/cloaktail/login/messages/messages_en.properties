# CloakTail sandbox theme. Keys prefixed "ct" are this theme's own; the rest override keycloak.v2.

ctBrand=CloakTail
ctSkip=Skip to the form
ctSandbox=Sandbox
ctRealm=Realm
ctSignInTo=Signing in to
ctTestEnvironment=Test environment, not for production

ctIntroTitle=You are in the CloakTail sandbox
ctIntroText=This Keycloak is a shared test environment for developers who register their apps in CloakTail. Accounts here are test users, not real identities.

ctDisclaimerTitle=Others can see what you enter here
ctDisclaimerText=Names, email addresses, attributes and sign-in results in this sandbox are visible to other developers and CloakTail administrators. Use made-up details, and never a password you use anywhere else.
ctDisclaimerShort=Shared sandbox: other people can see what you enter. Use made-up details only.
ctDisclaimerLink=Read the disclaimer

ctStepsTitle=What happens next
ctOpenCloakTail=Open CloakTail

# Sign in
ctLogin1Title=Sign in as a test user
ctLogin1Text=Use a test user from CloakTail (Test users), or create one with Register.
ctLogin2Title=Keycloak signs you in
ctLogin2Text=It sends a signed SAML response or token to the app that sent you here.
ctLogin3Title=Check the result in your app
ctLogin3Text=Compare the attributes or claims it received with what you expected.

# Register
ctRegister1Title=Use made-up details
ctRegister1Text=A fictional name and an email address you don't mind other people seeing.
ctRegister2Title=Pick a throwaway password
ctRegister2Text=It is for this sandbox only. Never reuse a real one.
ctRegister3Title=You're signed straight in
ctRegister3Text=Keycloak creates the test user and returns you to the app.

# Reset password
ctReset1Title=Enter the test user
ctReset1Text=The username or email of the sandbox account.
ctReset2Title=Email may not arrive
ctReset2Text=Sandbox email delivery isn't guaranteed. If nothing arrives, reset the password in CloakTail under Test users.

# Required actions (update password, profile, email, OTP setup, terms)
ctAction1Title=One more step
ctAction1Text=Keycloak needs this before it can finish signing you in.
ctAction2Title=Then back to your app
ctAction2Text=You return to the app automatically when it's done.

# Errors and info
ctError1Title=Start again from your app
ctError1Text=Sign-in links expire. Go back to the app and sign in again.
ctError2Title=Still failing?
ctError2Text=CloakTail's troubleshooting guide lists the usual causes: entity ID, ACS URL, certificates and signatures.

# Generic
ctDefault1Title=Follow the steps on this page
ctDefault1Text=Keycloak returns you to your app when it's done.

ctRegisterNotice=Test user data is visible to other people. Use a fictional name and email, and a password used nowhere else.

